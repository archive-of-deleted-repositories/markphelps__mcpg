[package]
name = "mcpg"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
reqwest = "0.13.1"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
anyhow = "1.0"
async-trait = "0.1"
tokio = {version = "1.49", features = ["rt-multi-thread", "macros", "process", "io-util"]}

[dev-dependencies]
tempfile = "3.14.0"
serial_test = "3.2.0"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
harness = true
